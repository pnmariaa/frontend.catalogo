<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrossel CSS</title>
    <link rel="stylesheet" href="style.css">

    
</head>


<body>

    <header>

        <h1>Galeria de Paisagens</h1>

        <p>Carrossel feito apenas com HTML e CSS</p>

    </header>


    <main>

        <h2>Conheça nossas paisagens</h2>


        <!-- BOTÕES INVISÍVEIS -->

        <input type="radio" name="carrossel" id="slide1" checked>

        <input type="radio" name="carrossel" id="slide2">

        <input type="radio" name="carrossel" id="slide3">

        <input type="radio" name="carrossel" id="slide4">

        <input type="radio" name="carrossel" id="slide5">


        <!-- CARROSSEL -->

        <section class="carrossel">

            <div class="slides">


                <figure class="slide">

                    <img
                        src="https://m.media-amazon.com/images/I/8133Z94It8S._SY342_.jpg"
                        alt="O povo do ar"
                    >

                    <figcaption>
                       Na série O povo do ar , a autora best-seller Holly Black transporta os leitores para Reino das Fadas. Não aquelas dos contos clássicos, fadas que podem ser cruéis e mortais, especialmente se motivadas pelo poder. Uma aventura que mistura magia, intrigas palacianas e romance.
                       Valor na Amazon: R$116,15
                    </figcaption>

                </figure>


                <figure class="slide">

                    <img
                        src="https://m.media-amazon.com/images/I/41APghMvSAL._SX342_SY445_ML2_.jpg"
                        alt="Estilhaça-me"
                    >

                    <figcaption>
                        A trama acompanha Juliette Ferrars, uma jovem de 17 anos com um toque letal que pode causar dor extrema ou até matar. Isolada pelo mundo e tratada como monstro, ela passa anos presa em uma cela até que o Restabelecimento — um regime autoritário que domina o planeta — decide usá-la como arma. No entanto, Juliette decide que não vai mais obedecer e busca lutar por sua liberdade e descobrir o seu passado.
                        Valor na Amazon: R$180,40
                    </figcaption>

                </figure>


                <figure class="slide">

                    <img
                        src="https://m.media-amazon.com/images/I/51XIHl3dNIL._AC_UL320_.jpg"
                        alt="A empregada"
                    >

                    <figcaption>
                        A trilogia de suspense psicológico "A Empregada", escrita por Freida McFadden, acompanha a trajetória de Millie Calloway, uma ex-presidiária que tenta reconstruir a vida, mas acaba envolvida em tramas perigosas com casais ricos e abusivos.
                        Valor na Amazon: R$112,95
                    </figcaption>

                </figure>


                <figure class="slide">

                    <img
                        src="https://m.media-amazon.com/images/I/611DdDRQxEL._SY342_.jpg"
                        alt="Harry Potter"
                    >

                    <figcaption>
                        Harry Potter é uma série de romances de fantasia que acompanha a vida de um jovem órfão que descobre ser um bruxo aos 11 anos e vai estudar na Escola de Magia e Bruxaria de Hogwarts
                        Valor na Amazon: R$400,89
                    </figcaption>

                </figure>


                <figure class="slide">

                    <img
                        src="https://m.media-amazon.com/images/I/61NTMkF4d+L._SL1000_.jpg"
                        alt="Percy Jackson"
                    >

                    <figcaption>
                        A saga Percy Jackson & os Olimpianos fala sobre um garoto de 12 anos que descobre ser um semideus, filho do deus grego Poseidon, e precisa enfrentar monstros e deuses no século XXI.
                        Valor na Amazon: R$224,70
                    </figcaption>

                </figure>


            </div>

        </section>


        <!-- BOTÕES VISÍVEIS -->

        <div class="botoes">

            <label for="slide1"></label>

            <label for="slide2"></label>

            <label for="slide3"></label>

            <label for="slide4"></label>

            <label for="slide5"></label>

        </div>

    </main>


    <footer>

        <p>Desenvolvido para estudo de HTML e CSS</p>

    </footer>

</body>

</html>
